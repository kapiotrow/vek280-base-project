# xrt.ini -- XRT runtime configuration, PACKAGED ONTO THE SD CARD next to the
# host ELF, so XRT picks it up from the process's working directory at startup.
#
# WHY IT IS PACKAGED SEPARATELY: nothing in the boot image depends on this
# file's contents. Every setting here can be changed by mounting the card and
# editing it -- no rebuild, no repackage, no re-synthesis. That makes it the
# cheapest experiment in the whole project.
#
# TWO TRAPS, both of which make a change look like "no effect":
#
#  1. AN UNRECOGNISED KEY IS SILENTLY IGNORED. XRT warns about neither typos nor
#     keys that do not exist in this release. Before concluding that a setting
#     did nothing, confirm the key exists in THIS build, on the board:
#         strings /usr/lib/libxrt_core.so* | grep -i <key>
#     Guessing key names from another XRT version's documentation is how an
#     afternoon of A/B runs produces four identical numbers.
#
#  2. THE FILE MUST BE IN THE WORKING DIRECTORY. run_script.sh cd's nowhere, so
#     that is the FAT partition root. A copy in a subdirectory is inert.

# Tracing is OFF deliberately. Turning it on changes the timing you are trying
# to measure, and in hw_emu it slows an already slow run considerably. Enable it
# to answer a specific question, then turn it off again.
[Debug]
device_trace=off
opencl_summary=false

#[Emulation]
# Opens the Vivado waveform viewer during an hw_emu run. Phase 2 uses a scripted
# probe instead (deterministic, and it runs headless), but this is the quick way
# to look at a stalled stream by hand.
#launch_waveform=gui
